<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | ShopEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="index.html">ShopEase</a>
  <div class="d-flex gap-3 ms-auto">
    <a class="nav-link text-white" href="index.html">Home</a>
    <a class="nav-link text-white" href="cart.html">Cart</a>
    <a class="nav-link text-white" href="login.html">Login</a>
    <a class="nav-link text-white" href="signup.html">Signup</a>
  </div>
</nav>

<main class="container py-5">
  <h1 class="fs-3 fw-bold mb-4">Checkout</h1>

  <div class="row g-4">

    <div class="col-12 col-lg-7">
      <form class="card p-4">
        <h2 class="fs-5 fw-bold mb-3">Shipping Details</h2>
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" placeholder="Jane Doe" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" placeholder="Street address" required>
        </div>
        <div class="row">
          <div class="col-6 mb-3">
            <label class="form-label">City</label>
            <input type="text" class="form-control" required>
          </div>
          <div class="col-6 mb-3">
            <label class="form-label">Postal Code</label>
            <input type="text" class="form-control" required>
          </div>
        </div>

        <h2 class="fs-5 fw-bold mt-3 mb-3">Payment Details</h2>
        <div class="mb-3">
          <label class="form-label">Card Number</label>
          <input type="text" class="form-control" placeholder="1234 5678 9012 3456" required>
        </div>
        <div class="row">
          <div class="col-6 mb-3">
            <label class="form-label">Expiry Date</label>
            <input type="text" class="form-control" placeholder="MM/YY" required>
          </div>
          <div class="col-6 mb-3">
            <label class="form-label">CVV</label>
            <input type="text" class="form-control" placeholder="123" required>
          </div>
        </div>

        <button type="submit" class="btn btn-dark w-100">Place Order</button>
      </form>
    </div>

    <div class="col-12 col-lg-5">
      <div class="card p-4">
        <h2 class="fs-5 fw-bold mb-3">Order Summary</h2>
        <div class="d-flex justify-content-between mb-2">
          <span>Wireless Headphones &times; 1</span>
          <span>$59.99</span>
        </div>
        <div class="d-flex justify-content-between mb-2">
          <span>Smart Watch &times; 2</span>
          <span>$179.98</span>
        </div>
        <div class="d-flex justify-content-between mb-2">
          <span>Backpack &times; 1</span>
          <span>$45.00</span>
        </div>
        <div class="d-flex justify-content-between mb-2 border-top pt-2">
          <span>Shipping</span>
          <span>$5.00</span>
        </div>
        <div class="d-flex justify-content-between fw-bold fs-5 border-top pt-2">
          <span>Total</span>
          <span>$289.97</span>
        </div>
      </div>
    </div>

  </div>
</main>

<footer class="text-center py-3 bg-dark text-white small">
  &copy; 2026 ShopEase. All rights reserved.
</footer>

</body>
</html>
