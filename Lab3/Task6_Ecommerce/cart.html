<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart | ShopEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="index.html">ShopEase</a>
  <div class="d-flex gap-3 ms-auto">
    <a class="nav-link text-white" href="index.html">Home</a>
    <a class="nav-link text-white" href="cart.html">Cart</a>
    <a class="nav-link text-white" href="login.html">Login</a>
    <a class="nav-link text-white" href="signup.html">Signup</a>
  </div>
</nav>

<main class="container py-5">
  <h1 class="fs-3 fw-bold mb-4">Your Cart</h1>

  <div class="table-responsive">
    <table class="table align-middle">
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Subtotal</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Wireless Headphones</td>
          <td>$59.99</td>
          <td><input type="number" class="form-control" style="width:80px" value="1" min="1"></td>
          <td>$59.99</td>
          <td><button class="btn btn-outline-dark btn-sm" type="button">Remove</button></td>
        </tr>
        <tr>
          <td>Smart Watch</td>
          <td>$89.99</td>
          <td><input type="number" class="form-control" style="width:80px" value="2" min="1"></td>
          <td>$179.98</td>
          <td><button class="btn btn-outline-dark btn-sm" type="button">Remove</button></td>
        </tr>
        <tr>
          <td>Backpack</td>
          <td>$45.00</td>
          <td><input type="number" class="form-control" style="width:80px" value="1" min="1"></td>
          <td>$45.00</td>
          <td><button class="btn btn-outline-dark btn-sm" type="button">Remove</button></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="row justify-content-end">
    <div class="col-12 col-md-4">
      <div class="card p-3">
        <div class="d-flex justify-content-between mb-2">
          <span>Subtotal</span>
          <span>$284.97</span>
        </div>
        <div class="d-flex justify-content-between mb-2">
          <span>Shipping</span>
          <span>$5.00</span>
        </div>
        <div class="d-flex justify-content-between fw-bold border-top pt-2 mb-3">
          <span>Total</span>
          <span>$289.97</span>
        </div>
        <a href="checkout.html" class="btn btn-dark w-100">Proceed to Checkout</a>
      </div>
    </div>
  </div>
</main>

<footer class="text-center py-3 bg-dark text-white small">
  &copy; 2026 ShopEase. All rights reserved.
</footer>

</body>
</html>
