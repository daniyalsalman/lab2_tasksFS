<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | ShopEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="index.html">ShopEase</a>
  <div class="d-flex gap-3 ms-auto">
    <a class="nav-link text-white" href="index.html">Home</a>
    <a class="nav-link text-white" href="cart.html">Cart</a>
    <a class="nav-link text-white" href="login.html">Login</a>
    <a class="nav-link text-white" href="signup.html">Signup</a>
  </div>
</nav>

<main class="container py-5" style="max-width:480px">
  <h1 class="fs-3 fw-bold text-center mb-4">Log In</h1>

  <form class="card p-4">
    <div class="mb-3">
      <label class="form-label">Email Address</label>
      <input type="email" class="form-control" placeholder="jane@example.com" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" placeholder="Enter password" required>
    </div>
    <button type="submit" class="btn btn-dark w-100">Log In</button>
    <p class="text-center small mt-3 mb-0">Don't have an account? <a href="signup.html">Sign up</a></p>
  </form>
</main>

<footer class="text-center py-3 bg-dark text-white small">
  &copy; 2026 ShopEase. All rights reserved.
</footer>

</body>
</html>
